name: .NET validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore TRSHackathon.sln
      - run: dotnet build TRSHackathon.sln --no-restore
      - run: dotnet test TRSHackathon.sln --no-build
      - run: dotnet format TRSHackathon.sln --verify-no-changes --no-restore
